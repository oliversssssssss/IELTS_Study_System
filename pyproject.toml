[project]
name = "ielts-study-system"
version = "0.0.1"
description = "Personal IELTS preparation tool with AI-powered features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.3",
    "feedparser>=6.0.12",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "openai>=2.41.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "spacy>=3.8.14",
    "typer>=0.26.7",
    "uvicorn>=0.49.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RET", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "smoke: 调用真实外部 API 的冒烟测试（可用 -m \"not smoke\" 排除）",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.15",
]
